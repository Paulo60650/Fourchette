name: Build APK de test

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Régénérer les questions et la page
        run: python3 build_questions.py && python3 build_app.py

      - name: Installer Capacitor
        run: npm install

      - name: Créer le projet Android
        run: npx cap add android

      - name: Icône et écran de démarrage
        continue-on-error: true
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#12062B' --splashBackgroundColor '#12062B'

      - name: Verrouiller l'orientation portrait
        run: sed -i 's#<activity#<activity android:screenOrientation="portrait"#' android/app/src/main/AndroidManifest.xml

      - name: Synchroniser la page web
        run: npx cap sync android

      - name: Compiler l'APK (debug, signé avec la clé de debug)
        working-directory: android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: la-fourchette-test-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
