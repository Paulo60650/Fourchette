<title>La Fourchette</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Concept: application mobile jouable dans un cadre de téléphone.
   Fin de journée, aubergine et safran, avec une couleur par thème de question. */
:root{
  --display:'Bricolage Grotesque','Hanken Grotesk',system-ui,sans-serif;
  --body:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --bg:#EFE5DF; --surface:#F8F1EC; --card:#FFFCFA; --ink:#2B2130; --ink2:#6B5B68;
  --line:#E5D8D0; --track:#E8DBD3;
  --accent:#E8A62F; --on-accent:#2B2130;
  --plum:#5B2C5F; --on-plum:#FFFFFF; --plum-soft:#EBDDEC;
  --hit:#3F7552; --hit-soft:#DCEBDF; --miss:#A5324C; --miss-soft:#F4DBDF;
  --shadow:0 1px 2px rgba(43,33,48,.07),0 12px 32px rgba(43,33,48,.10);
  --glow:rgba(232,166,47,.16);
  --kw:#FFFFFF; --kd:#2B2130;
  --c-sport:#E8A62F; --c-geo:#1F8A8A; --c-nature:#3C8650; --c-transport:#4A5FC1;
  --c-terr:#C23F69; --c-hist:#8A5BC4; --c-sci:#1B82BA; --c-art:#C9532A;
  --a1:#6B3470; --a2:#1F8A8A; --a3:#C23F69; --a4:#4A5FC1; --a5:#C9532A; --a6:#3C8650;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16101A; --surface:#211826; --card:#2B2031; --ink:#F6ECF1; --ink2:#B9A8B4;
    --line:#3A2D40; --track:#3A2D40;
    --accent:#F0B54A; --on-accent:#2B2130;
    --plum:#D9A6DD; --on-plum:#2B2130; --plum-soft:#3E2C45;
    --hit:#86BC95; --hit-soft:#233A2B; --miss:#EE879D; --miss-soft:#47252D;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.35);
    --glow:rgba(240,181,74,.10);
    --kw:#1F1522; --kd:#1F1522;
    --c-sport:#F0B54A; --c-geo:#4FC1BD; --c-nature:#7CCB8B; --c-transport:#8FA2F2;
    --c-terr:#F08AAA; --c-hist:#B995EB; --c-sci:#66C4F2; --c-art:#F59A72;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#16101A; --surface:#211826; --card:#2B2031; --ink:#F6ECF1; --ink2:#B9A8B4;
  --line:#3A2D40; --track:#3A2D40;
  --accent:#F0B54A; --on-accent:#2B2130;
  --plum:#D9A6DD; --on-plum:#2B2130; --plum-soft:#3E2C45;
  --hit:#86BC95; --hit-soft:#233A2B; --miss:#EE879D; --miss-soft:#47252D;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.35);
  --glow:rgba(240,181,74,.10);
  --kw:#1F1522; --kd:#1F1522;
  --c-sport:#F0B54A; --c-geo:#4FC1BD; --c-nature:#7CCB8B; --c-transport:#8FA2F2;
  --c-terr:#F08AAA; --c-hist:#B995EB; --c-sci:#66C4F2; --c-art:#F59A72;
  color-scheme:dark;
}
.d-sport{--dc:var(--c-sport);--dk:var(--kd)}
.d-geo{--dc:var(--c-geo);--dk:var(--kw)}
.d-nature{--dc:var(--c-nature);--dk:var(--kw)}
.d-transport{--dc:var(--c-transport);--dk:var(--kw)}
.d-terr{--dc:var(--c-terr);--dk:var(--kw)}
.d-hist{--dc:var(--c-hist);--dk:var(--kw)}
.d-sci{--dc:var(--c-sci);--dk:var(--kw)}
.d-art{--dc:var(--c-art);--dk:var(--kw)}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{overscroll-behavior:none}
html,body{height:100%}
body{margin:0;padding-inline:16px;padding-block:16px;background:var(--bg);color:var(--ink);
  font:400 15px/1.45 var(--body);display:flex;justify-content:center;align-items:center;
  -webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid var(--plum);outline-offset:2px;border-radius:8px}
h1,h2,h3,p,ul{margin:0}
ul{padding:0;list-style:none}

.phone{position:relative;width:100%;max-width:400px;height:100%;max-height:820px;background:var(--surface);
  border-radius:34px;box-shadow:var(--shadow);border:1px solid var(--line);overflow:hidden;
  display:flex;flex-direction:column;
  background-image:radial-gradient(120% 60% at 100% -10%,var(--glow),transparent 60%)}
#screen{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:22px 20px 24px;scrollbar-width:thin}
.enter{animation:in .22s ease-out}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.enter{animation:none}*{transition:none!important}}

.tabs{display:flex;gap:2px;border-top:1px solid var(--line);background:var(--card);padding:6px 6px calc(8px + env(safe-area-inset-bottom,0px))}
.tabs[hidden]{display:none}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;border-radius:14px;color:var(--ink2);font-size:12px;font-weight:600}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--plum);background:var(--plum-soft)}
.tab[aria-current="page"] svg{stroke-width:2.2}

.label{font-size:13px;font-weight:600;color:var(--ink2)}
.muted{color:var(--ink2)}
.small{font-size:13px}

.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:18px}
.top h1{font:700 30px/1.1 var(--display);letter-spacing:-.02em}
.date{font-size:13px;font-weight:600;color:var(--ink2);text-transform:capitalize;margin-bottom:4px}
.streak{display:flex;flex-direction:column;align-items:center;min-width:64px;padding:8px 10px;border-radius:16px;
  background:linear-gradient(160deg,var(--c-sport),var(--c-art));color:#2B2130}
.streak b{font:700 24px/1 var(--display)}
.streak span{font-size:11px;font-weight:700;text-align:center;line-height:1.15;margin-top:2px}

.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 1px 2px rgba(43,33,48,.04)}
.stack{display:flex;flex-direction:column;gap:14px}
.sect{font:700 18px/1.2 var(--display);letter-spacing:-.01em;margin:4px 0 -4px}

.hero{position:relative;overflow:hidden;border-radius:26px;padding:20px 18px 18px;color:#fff;
  background:linear-gradient(135deg,#4B2250 0%,#8A3A7C 42%,#C94D70 78%,#E59A3A 120%);box-shadow:var(--shadow)}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:190px;height:190px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.22),transparent 68%)}
.hero > *{position:relative;z-index:1}
.hero .hl{font-size:13px;font-weight:700;opacity:.9}
.hero .hh{font:700 26px/1.1 var(--display);letter-spacing:-.02em;margin:4px 0 14px}
.swatch{display:flex;gap:6px;margin-bottom:16px}
.swatch i{width:22px;height:22px;border-radius:50%;background:var(--dc);box-shadow:0 0 0 2px rgba(255,255,255,.35)}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:50px;padding:12px 18px;border-radius:16px;font-weight:700;font-size:16px}
.btn.primary{background:var(--plum);color:var(--on-plum)}
.btn.ghost{border:1.5px solid var(--line);background:var(--card)}
.btn.accent{background:var(--accent);color:var(--on-accent)}
.btn.light{background:#fff;color:#2B2130}
.btn:active{transform:translateY(1px)}
.link{color:var(--plum);font-weight:700;text-decoration:underline;text-underline-offset:3px;font-size:14px}
.note{font-size:13px;color:var(--ink2);margin-top:10px;text-align:center}
.hero .note{color:rgba(255,255,255,.88)}

.themes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.theme{position:relative;overflow:hidden;border-radius:18px;padding:13px 14px;text-align:left;background:var(--dc);color:var(--dk);
  min-height:76px;display:flex;flex-direction:column;justify-content:space-between}
.theme::after{content:"";position:absolute;right:-24px;top:-24px;width:84px;height:84px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.3),transparent 70%)}
.theme b{font:700 17px/1.1 var(--display);position:relative;z-index:1}
.theme span{font-size:12px;font-weight:600;opacity:.85;position:relative;z-index:1}
.theme:active{transform:translateY(1px)}

.tilecard{display:flex;align-items:center;gap:14px;width:100%;text-align:left}
.tilecard .ic{width:46px;height:46px;border-radius:15px;flex:none;display:grid;place-items:center;color:#fff}
.tilecard .ic svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tilecard .tx{flex:1;min-width:0}
.tilecard .tx b{display:block;font-weight:700}
.tilecard .chev{width:20px;height:20px;stroke:var(--ink2);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.g-world{background:linear-gradient(135deg,#C23F69,#E8A62F)}
.g-league{background:linear-gradient(135deg,#6B3470,#4A5FC1)}

.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;flex:none}
.av.lg{width:38px;height:38px;font-size:14px}
.avatars{display:flex}
.avatars .av{border:2px solid var(--card);margin-left:-8px}
.avatars .av:first-child{margin-left:0}
.dchip{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:color-mix(in srgb,var(--dc) 20%,var(--card));color:color-mix(in srgb,var(--dc) 55%,var(--ink))}

/* Question */
.qtop{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.close{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1px solid var(--line)}
.close svg{width:18px;height:18px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round}
.qmeta{font-size:13px;font-weight:600;color:var(--ink2)}
.timer{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.tbar{flex:1;height:12px;border-radius:99px;background:var(--track);overflow:hidden}
.tbar i{display:block;height:100%;width:100%;border-radius:99px;background:var(--hit);transition:background .3s}
.timer.mid .tbar i{background:var(--accent)}
.timer.low .tbar i{background:var(--miss)}
.tnum{min-width:62px;text-align:right;font:700 22px/1 var(--display);font-variant-numeric:tabular-nums}
.timer.low .tnum{color:var(--miss);animation:pulse .5s ease-in-out infinite alternate}
@keyframes pulse{to{transform:scale(1.12)}}
.late{margin-top:10px;font-size:13px;font-weight:600;color:var(--miss)}
.qhead{position:relative;overflow:hidden;border-radius:24px;padding:18px 18px 20px;background:var(--dc);color:var(--dk)}
.qhead::after{content:"";position:absolute;right:-50px;top:-50px;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.28),transparent 68%)}
.qhead > *{position:relative;z-index:1}
.qdom{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:rgba(255,255,255,.26);color:var(--dk)}
.qtext{font:700 24px/1.2 var(--display);letter-spacing:-.02em;text-wrap:balance;margin-top:10px}
.readout{flex-wrap:wrap;display:flex;align-items:baseline;justify-content:center;gap:10px;margin:24px 0 8px;font-family:var(--display);font-weight:700;
  font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.readout .n{font-size:38px;line-height:1}
.readout .dash{font-size:26px;color:var(--ink2);font-weight:500}
.readout .u{font-size:15px;color:var(--ink2);font-weight:600;font-family:var(--body)}
.rail{position:relative;height:44px;margin:6px 16px 0;touch-action:none}
.bar{position:absolute;left:0;right:0;top:15px;height:14px;border-radius:99px;background:var(--track)}
.fill{position:absolute;top:15px;height:14px;border-radius:99px;background:var(--dc)}
.knob{position:absolute;top:8px;width:28px;height:28px;margin-left:-14px;border-radius:50%;background:#fff;
  border:5px solid var(--plum);box-shadow:0 2px 8px rgba(43,33,48,.35);touch-action:none;cursor:grab}
.knob:active{cursor:grabbing}
.ticks{position:relative;height:20px;margin:2px 16px 0;font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}
.ticks span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.gain{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:18px;padding:14px 16px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.gain b{font:700 22px/1 var(--display);font-variant-numeric:tabular-nums}
.gain .small{max-width:60%}
.hint{font-size:13px;color:var(--ink2);margin-top:12px;text-align:center}
.qfoot{margin-top:18px}

/* Révélation */
.dband{height:10px;border-radius:99px;background:var(--dc);margin-bottom:16px}
.verdict{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:14px;padding:6px 12px;border-radius:99px}
.verdict.tight,.verdict.wide{background:var(--hit-soft);color:var(--hit)}
.verdict.out{background:var(--miss-soft);color:var(--miss)}
.truth{font:700 46px/1.05 var(--display);letter-spacing:-.025em;margin:10px 0 2px;font-variant-numeric:tabular-nums}
.pts{display:flex;align-items:baseline;gap:6px;margin:6px 0 16px}
.pts b{font:700 34px/1 var(--display);color:var(--plum);font-variant-numeric:tabular-nums}
.ruler{width:100%;height:auto;display:block;overflow:visible}
.ruler text{font-family:var(--body);fill:var(--ink2);font-size:11px}
.ruler .nm{fill:var(--ink);font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink2);margin-top:8px}
.legend i{display:inline-block;width:14px;height:6px;border-radius:99px;margin-right:6px;vertical-align:middle}
.fact{margin-top:14px;font-size:14px;color:var(--ink2)}

/* Bilan */
.score{border-radius:24px;padding:20px;color:#fff;background:linear-gradient(135deg,#4B2250,#8A3A7C 55%,#C94D70)}
.score.themed{background:linear-gradient(135deg,color-mix(in srgb,var(--dc) 60%,#1d1020),var(--dc))}
.score.themed{color:var(--dk)}
.score.themed .label{color:inherit;opacity:.85}
.score .label{color:rgba(255,255,255,.85)}
.big{font:700 64px/1 var(--display);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.big small{font-size:22px;opacity:.8;font-weight:500}
.score p.l2{margin-top:8px;font-weight:600}
.delta{display:inline-block;margin-left:6px;padding:2px 9px;border-radius:99px;background:rgba(255,255,255,.22);font-size:13px;font-weight:700}
.list li{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.tile{width:22px;height:22px;border-radius:7px;flex:none}
.tile.tight{background:var(--hit)}
.tile.wide{background:var(--accent)}
.tile.out{background:var(--miss)}
.list .grow{flex:1;min-width:0}
.list .t{font-weight:600;font-size:14px;line-height:1.3}
.list b{font-variant-numeric:tabular-nums}
.key{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-top:6px}
.key span{display:inline-flex;align-items:center;gap:6px}
.key .tile{width:12px;height:12px;border-radius:4px}

/* Classements */
.seg2{display:flex;background:var(--track);border-radius:14px;padding:4px;margin:14px 0}
.seg2 button{flex:1;padding:9px 4px;border-radius:11px;font-weight:700;font-size:14px;color:var(--ink2)}
.seg2 button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(43,33,48,.15)}
.pills{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.pill{white-space:nowrap;padding:8px 14px;border-radius:99px;border:1.5px solid var(--line);font-weight:600;font-size:14px;background:var(--card);flex:none}
.pill[aria-pressed="true"]{background:var(--plum);color:var(--on-plum);border-color:var(--plum)}
.pill.thm[aria-pressed="true"]{background:var(--dc,var(--plum));color:var(--dk,var(--on-plum));border-color:transparent}
.pill.thm[class*="d-"]::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--dc);margin-right:7px}
.pill.thm[class*="d-"][aria-pressed="true"]::before{background:var(--dk)}
.rank{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:700 14px var(--display);color:var(--ink2);flex:none}
.rank.r1{background:linear-gradient(160deg,#F7D774,#E8A62F);color:#2B2130}
.rank.r2{background:linear-gradient(160deg,#DCE1EA,#A9B2C4);color:#2B2130}
.rank.r3{background:linear-gradient(160deg,#EDB794,#C27A52);color:#2B2130}
.board li{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:16px}
.board li.me{background:var(--plum-soft)}
.board .nm{flex:1;min-width:0}
.board .nm b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.board .nm span{font-size:12px;color:var(--ink2)}
.board .sc{font:700 18px var(--display);font-variant-numeric:tabular-nums}
.code{display:flex;align-items:center;justify-content:space-between;gap:12px}
.code b{font:700 22px var(--display);letter-spacing:.06em}
.mini{padding:8px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:13px}

.podium{display:flex;align-items:flex-end;gap:10px;margin:6px 0 14px}
.pcol{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px}
.pcol .nm{font-weight:700;font-size:13px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcol .sc{font:700 15px var(--display);font-variant-numeric:tabular-nums}
.pcol .cc{font-size:11px;color:var(--ink2);font-weight:600}
.pblock{width:100%;border-radius:16px 16px 6px 6px;display:grid;place-items:start center;padding-top:8px;font:700 26px var(--display);color:#2B2130;margin-top:6px}
.pblock.r1{height:96px;background:linear-gradient(170deg,#F7D774,#E8A62F)}
.pblock.r2{height:72px;background:linear-gradient(170deg,#DCE1EA,#A9B2C4)}
.pblock.r3{height:56px;background:linear-gradient(170deg,#EDB794,#C27A52)}
.mecard{border-radius:22px;padding:18px;color:#fff;background:linear-gradient(135deg,#4B2250,#8A3A7C 55%,#C94D70);margin-top:12px}
.mecard.themed{background:linear-gradient(135deg,color-mix(in srgb,var(--dc) 60%,#1d1020),var(--dc));color:var(--dk)}
.mecard .label{color:inherit;opacity:.85}
.mecard .rk{font:700 34px/1.05 var(--display);letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:2px}
.mecard .rk small{font-size:15px;font-weight:600;opacity:.85}
.dist{position:relative;height:12px;border-radius:99px;margin:22px 0 8px;background:linear-gradient(90deg,#C94D70,#E8A62F 50%,#2FB8A8)}
.dist i{position:absolute;top:-6px;width:5px;height:24px;border-radius:3px;background:#fff;margin-left:-2px;box-shadow:0 0 0 2px rgba(43,33,48,.35)}
.dist-l{display:flex;justify-content:space-between;font-size:12px;opacity:.9}

/* Profil */
.meter{position:relative;height:14px;border-radius:99px;background:linear-gradient(90deg,var(--c-terr),var(--accent) 70%,var(--c-nature));margin:26px 0 8px}
.meter .mk{position:absolute;top:-7px;width:4px;height:28px;border-radius:2px;background:var(--ink);margin-left:-2px}
.meter .tg{position:absolute;top:-7px;width:0;height:28px;border-left:2px dashed var(--ink2);margin-left:-1px}
.meter .l{position:absolute;top:-24px;font-size:12px;font-weight:700;transform:translateX(-50%);white-space:nowrap}
.scale{display:flex;justify-content:space-between;font-size:12px;color:var(--ink2)}
.chartwrap{position:relative}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--surface);font-size:12px;font-weight:600;padding:4px 8px;border-radius:8px;transform:translate(-50%,-130%);white-space:nowrap}
.dom li{display:grid;grid-template-columns:104px 1fr 44px;align-items:center;gap:10px;padding:7px 0;font-size:14px}
.dom .b{position:relative;height:10px;border-radius:99px;background:var(--track)}
.dom .b i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--dc)}

 {name:'Les Voisins du 3e',code:'VOIS-83K',m:[['Camille',71,68,44,160],['Inès',66,64,39,142],['Vous',0,0,0,0],['Malik',49,50,31,118],['Théo',41,44,22,95]]},

/* Echelles et score */
function pos(q,v){return q.kind==='lin'?(v-q.min)/(q.max-q.min):Math.log(v/q.min)/Math.log(q.max/q.min)}
function sig3(v){var p=Math.pow(10,Math.floor(Math.log10(v))-2);return Math.round(v/p)*p}
function val(q,n){var v=q.kind==='lin'?Math.round(q.min+n*(q.max-q.min)):sig3(q.min*Math.exp(n*Math.log(q.max/q.min)));return (q.int&&v<1000)?Math.max(1,Math.round(v)):v}
function widthS(q,lo,hi){return q.kind==='lin'?(hi-lo)/q.sc:Math.log(hi/lo)}

  if(!inside)return {pts:0,inside:false,tier:'out'};

}

function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}

/* Etat */
var S={skin:'vif',tab:'home',view:'home',league:0,range:'week',wr:'week',ws:'world',wt:'all',wm:'avg',cur:{lo:0,hi:0}};
var G={set:[],ans:[],qi:0,theme:null,before:0};

function streakN(){var days={};LOG.forEach(function(e){days[dkey(e.t)]=1});var n=0,t=Date.now();if(!days[dkey(t)])t-=864e5;while(days[dkey(t)]){n++;t-=864e5}return n}

resetStats();load();
function avgOf(th){
  if(th&&th!=='all')return ST[th].n?ST[th].s/ST[th].n:0;

}

function qOf(th){if(th&&th!=='all')return ST[th].n;return qCount()}
function qCount(){var n=0;DN.forEach(function(d){n+=ST[d].n});return n}
function totalOf(r,th){
  var t=0;DN.forEach(function(d){if(th&&th!=='all'&&th!==d)return;t+=r==='season'?ST[d].s:logOf(d,Date.now()-7*864e5).reduce(function(x,e){return x+e.p},0)});return Math.round(t);
}
var CUM={week:{med:600,t:[9320,8870,8540,8210,7960,7710,7480,7250,7040,6830]},season:{med:3000,t:[48210,45980,44120,42900,41350,40100,38870,37640,36500,35480]}};
function myCum(r,th){
  th=th||'all';
  var fr=S.ws==='france',share=th==='all'?1:SHARE[th];
  var N=Math.round(WORLD[r].n*share*(fr?.6:1)),tot=totalOf(r,th),med=CUM[r].med*share;
  var p=1/(1+Math.exp(-Math.log(Math.max(1,tot)/med)/0.8)),rank=Math.max(3,Math.round(N*(1-p)));
  var pct=Math.max(1,Math.round(rank/N*100));

function myWorld(r,th){
  th=th||'all';
  var fr=S.ws==='france',share=th==='all'?1:SHARE[th];
  var N=Math.round(WORLD[r].n*share*(fr?.6:1)),avg=avgOf(th),rank=rankOf(avg,N);

function mountRange(q,fixed){
  var rail=$('#rail'),fill=$('#fill'),kL=$('#kLo'),kH=$('#kHi');
  var gap=fixed||.04,lo=.5-gap/2,hi=.5+gap/2,off=0,drag=false;
  if(fixed)rail.classList.add('fixed');
  function upd(){
    var L=val(q,lo),H=val(q,hi);
    if(H<=L)H=q.int?L+1:L*1.01;
    kL.style.left=lo*100+'%';kH.style.left=hi*100+'%';
    fill.style.left=lo*100+'%';fill.style.width=(hi-lo)*100+'%';
    $('#vLo').textContent=q.f(L);$('#vHi').textContent=q.f(H);
    var len=(q.f(L)+q.f(H)+(q.unit||'')).length,fs=(len>17?24:len>13?30:38)+'px';
    $('#vLo').style.fontSize=fs;$('#vHi').style.fontSize=fs;
    kL.setAttribute('aria-valuetext',q.f(L)+' '+q.unit);kH.setAttribute('aria-valuetext',q.f(H)+' '+q.unit);
    kL.setAttribute('aria-valuemin',0);kL.setAttribute('aria-valuemax',100);kL.setAttribute('aria-valuenow',Math.round(lo*100));
    kH.setAttribute('aria-valuemin',0);kH.setAttribute('aria-valuemax',100);kH.setAttribute('aria-valuenow',Math.round(hi*100));
    $('#pIn').textContent=ptsFromS(widthS(q,L,H));
    $('#wInfo').textContent=q.kind==='lin'?('Écart de '+(H-L)+' ans'):('Fourchette ×'+(H/L).toFixed(1).replace('.',','));
    S.cur.lo=L;S.cur.hi=H;
  }
  function nx(x){var r=rail.getBoundingClientRect();return Math.max(0,Math.min(1,(x-r.left)/r.width))}
  function setX(x,which){
    var n=nx(x);
    if(which==='lo')lo=Math.min(n,hi-gap);else hi=Math.max(n,lo+gap);upd();
  }
  function setC(x){lo=Math.max(0,Math.min(1-gap,nx(x)-off-gap/2));hi=lo+gap;upd()}
  function bind(k,which){
    var on=false;
    k.addEventListener('pointerdown',function(e){on=true;k.setPointerCapture(e.pointerId);k.focus();if(fixed)off=nx(e.clientX)-(lo+gap/2);e.preventDefault();e.stopPropagation()});
    k.addEventListener('pointermove',function(e){if(on){if(fixed)setC(e.clientX);else setX(e.clientX,which)}});
    k.addEventListener('pointerup',function(){on=false});
    k.addEventListener('pointercancel',function(){on=false});
    k.addEventListener('keydown',function(e){
      var step=e.shiftKey?.05:.01,d=0;
      if(e.key==='ArrowLeft'||e.key==='ArrowDown')d=-step;else if(e.key==='ArrowRight'||e.key==='ArrowUp')d=step;else return;
      e.preventDefault();
      if(fixed){lo=Math.max(0,Math.min(1-gap,lo+d));hi=lo+gap;upd()}
      else if(which==='lo')lo=Math.max(0,Math.min(hi-gap,lo+d));else hi=Math.min(1,Math.max(lo+gap,hi+d));upd();
    });
  }
  bind(kL,'lo');bind(kH,'hi');
  rail.addEventListener('pointerdown',function(e){
    if(fixed){drag=true;off=0;rail.setPointerCapture(e.pointerId);setC(e.clientX);return}
    if(e.target!==rail&&!e.target.classList.contains('bar')&&e.target!==fill)return;
    var r=rail.getBoundingClientRect(),n=(e.clientX-r.left)/r.width;
    setX(e.clientX,Math.abs(n-lo)<Math.abs(n-hi)?'lo':'hi');
  });
  if(fixed){
    rail.addEventListener('pointermove',function(e){if(drag)setC(e.clientX)});
    rail.addEventListener('pointerup',function(){drag=false});
    rail.addEventListener('pointercancel',function(){drag=false});
  }
  upd();
  return upd;
}
/* Révélation : votre fourchette, la foule et la vraie valeur */
function ruler(q,a){
  var W=340,x0=66,x1=332,pw=x1-x0,rowH=30,top=44;
  var H=top+rowH+30;
  function X(v){return x0+Math.max(0,Math.min(1,pos(q,v)))*pw}
  var mu=Math.max(.08,Math.min(.92,pos(q,q.truth)+.05)),sd=.13,pts=[],i;
  for(i=0;i<=60;i++){var t=i/60,d=Math.exp(-.5*Math.pow((t-mu)/sd,2));pts.push((x0+t*pw).toFixed(1)+','+(36-d*28).toFixed(1))}
  var area='M'+x0+',36 L'+pts.join(' L')+' L'+x1+',36 Z';
  var s='<svg class="ruler" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Votre fourchette, la répartition des réponses des joueurs et la vraie valeur sur une même échelle">';
  s+='<path d="'+area+'" style="fill:color-mix(in srgb,var(--dc) 38%,var(--card))"/><text x="0" y="30" class="nm" style="font-weight:500">Joueurs</text>';
  s+='<line x1="'+x0+'" y1="36" x2="'+x1+'" y2="36" stroke="var(--line)" stroke-width="1"/>';
  var y=top+rowH/2,xa=X(a.lo),xb=X(a.hi);
  s+='<line x1="'+x0+'" y1="'+y+'" x2="'+x1+'" y2="'+y+'" stroke="var(--line)" stroke-width="1"/>';
  s+='<text x="0" y="'+(y+4)+'" class="nm">Vous</text>';
  s+='<rect x="'+xa.toFixed(1)+'" y="'+(y-7)+'" width="'+Math.max(5,xb-xa).toFixed(1)+'" height="14" rx="7" fill="var(--plum)"/>';
  var ty=top+rowH+6,tx=X(q.truth);
  s+='<line x1="'+tx.toFixed(1)+'" y1="38" x2="'+tx.toFixed(1)+'" y2="'+ty+'" stroke="var(--ink)" stroke-width="2"/>';
  s+='<path d="M'+tx.toFixed(1)+' 33 l5 5 l-5 5 l-5 -5 z" fill="var(--ink)"/>';
  q.ticks.forEach(function(t){
    var x=X(t),anchor=x>x1-14?'end':(x<x0+14?'start':'middle');
    s+='<line x1="'+x.toFixed(1)+'" y1="'+ty+'" x2="'+x.toFixed(1)+'" y2="'+(ty+4)+'" stroke="var(--ink2)"/>';
    s+='<text x="'+x.toFixed(1)+'" y="'+(ty+17)+'" text-anchor="'+anchor+'">'+q.f(t)+'</text>';
  });
  return s+'</svg>';
}

/* Classement mondial : général et par thème */
function world(){
  S.view='world';S.tab='world';
  var r=S.wr,fr=S.ws==='france',th=S.wt,w=WORLD[r],all=th==='all';
  var off=all?0:(DN.indexOf(th)+1)*3%10,base=fr?F_NAMES:W_NAMES;
  var names=base.slice(off).concat(base.slice(0,off));
  var tops=w.t.map(function(s,i){return s-(all?0:(DN.indexOf(th)+1)*.35)-(fr?.15*(i+1):0)});
  var cum=S.wm==='cum',me=cum?myCum(r,th):myWorld(r,th);
  if(cum){tops=CUM[r].t.map(function(s,i){return Math.round(s*(all?1:SHARE[th]*1.3)*(fr?(1-.04*(i+1)):1))})}
  var fmt=cum?fnum:f1;
  var podium=[1,0,2].map(function(k){
    return '<div class="pcol">'+avatar(names[k][0],'lg')+'<span class="nm">'+esc(names[k][0])+'</span><span class="sc">'+fmt(tops[k])+'</span><span class="cc">'+names[k][1]+'</span><div class="pblock r'+(k+1)+'">'+(k+1)+'</div></div>';
  }).join('');
  var list=names.slice(3).map(function(nm,j){var k=j+3;return '<li><span class="rank">'+(k+1)+'</span>'+avatar(nm[0])+'<div class="nm"><b>'+esc(nm[0])+'</b><span>'+nm[1]+(cum?' · '+fnum(tops[k]/62)+' questions':'')+'</span></div><span class="sc">'+fmt(tops[k])+'</span></li>'}).join('');
  var thPills='<button class="pill thm" data-wt="all" aria-pressed="'+all+'">Général</button>'+DN.map(function(d){return '<button class="pill thm '+dcn(d)+'" data-wt="'+d+'" aria-pressed="'+(th===d)+'">'+d+'</button>'}).join('');
  var mine='<div class="mecard '+(all?'':'themed '+dcn(th))+'"><p class="label">Votre rang '+(cum?'cumulé':'niveau')+' · '+(all?'général':esc(th))+(fr?' · France':' · monde')+'</p>'+
     (me.ok?
     '<p class="rk">'+ord(me.rank)+' <small>sur '+nf.format(me.n)+'</small></p>'+
     '<p style="margin-top:4px;font-weight:600">'+(cum?fnum(me.tot)+' points cumulés · top '+me.pct+' %':f1(me.avg)+' points par question · top '+me.pct+' %')+'</p>'+
     '<div class="dist" role="img" aria-label="Meilleur que '+me.better+' % des joueurs"><i style="left:'+me.better+'%"></i></div>'+
     '<div class="dist-l"><span>Derniers</span><span>Meilleur que '+me.better+' %</span><span>Premiers</span></div>':
     '<p class="rk" style="font-size:26px">Pas encore classé</p><p style="margin-top:4px;font-weight:600">'+(cum?'Jouez une première question.':'Encore '+me.need+' question'+(me.need>1?'s':'')+' dans '+(all?'ce classement':esc(th))+' pour être classé.')+'</p>')+'</div>';
  var html='<section>'+
   '<div class="top" style="margin-bottom:6px"><div><p class="date">Classement</p><h1>Mondial</h1></div></div>'+
   '<div class="seg2" role="group" aria-label="Type de classement" style="margin:8px 0 12px"><button data-wm="avg" aria-pressed="'+(!cum)+'">Niveau</button><button data-wm="cum" aria-pressed="'+cum+'">Cumulé</button></div>'+
   '<div class="pills" style="margin-bottom:4px" role="group" aria-label="Thème">'+thPills+'</div>'+
   '<div class="seg2" role="group" aria-label="Période">'+[['week','7 jours'],['season','Saison']].map(function(x){return '<button data-wr="'+x[0]+'" aria-pressed="'+(S.wr===x[0])+'">'+x[1]+'</button>'}).join('')+'</div>'+
   '<div class="pills" style="margin-bottom:14px"><button class="pill" data-ws="world" aria-pressed="'+(!fr)+'">Monde</button><button class="pill" data-ws="france" aria-pressed="'+fr+'">France</button></div>'+
   '<div class="podium">'+podium+'</div>'+
   '<ul class="board">'+list+'</ul>'+mine+
   '<div class="card" style="margin-top:14px"><p class="label">Comment on est classé</p><p class="small" style="margin-top:4px">'+(cum?'Cumulé : le total de points gagnés sur la période. Plus vous jouez, plus vous montez, mais une question ratée n’ajoute rien. ':'Niveau : la moyenne de points par question, au moins 10 questions jouées. Elle récompense la justesse, pas le volume. ')+'Chaque joueur reçoit ses propres questions, tirées au hasard : personne ne peut les connaître à l’avance. Joueurs fictifs.</p></div></section>';
  show(html,true);
  $$('[data-wr]').forEach(function(b){b.onclick=function(){S.wr=b.dataset.wr;world()}});
  $$('[data-ws]').forEach(function(b){b.onclick=function(){S.ws=b.dataset.ws;world()}});
  $$('[data-wm]').forEach(function(b){b.onclick=function(){S.wm=b.dataset.wm;world()}});
  $$('[data-wt]').forEach(function(b){b.onclick=function(){S.wt=b.dataset.wt;world()}});
}

/* Ligues : chacun joue ses propres questions */
function leagues(){
  S.view='leagues';S.tab='leagues';
  var L=LEAGUES[S.league],key=S.range==='week'?'week':'season';
  var myQ=qCount(),wl=logOf('all',Date.now()-7*864e5),myAs=avgOf('all'),myAw=wl.length?wl.reduce(function(x,e){return x+e.p},0)/wl.length:0;
  var members=L.m.map(function(m){
    if(m[0]==='Vous')return {n:'Vous',week:myAw,season:myAs,wq:wl.length,sq:myQ};
    return {n:m[0],week:m[1],season:m[2],wq:m[3],sq:m[4]};
  });
  members.sort(function(a,b){return b[key]-a[key]});
  var board=members.map(function(m,i){
    var k=key==='week'?m.wq:m.sq;
    return '<li class="'+(m.n==='Vous'?'me':'')+'"><span class="rank '+(i<3?'r'+(i+1):'')+'">'+(i+1)+'</span>'+avatar(m.n,'lg')+
    '<div class="nm"><b>'+esc(m.n)+'</b><span>'+k+' questions jouées</span></div><span class="sc">'+(k?f1(m[key]):'—')+'</span></li>';
  }).join('');
  var pills=LEAGUES.map(function(l,i){return '<button class="pill" data-l="'+i+'" aria-pressed="'+(i===S.league)+'">'+esc(l.name)+'</button>'}).join('')+'<button class="pill" id="newL">+ Créer</button>';
  var html='<section>'+
   '<div class="top" style="margin-bottom:12px"><div><p class="date">Entre amis</p><h1>Vos ligues</h1></div></div>'+
   '<div class="pills">'+pills+'</div>'+
   '<div class="seg2" role="group" aria-label="Période"><button data-r="week" aria-pressed="'+(S.range==='week')+'">7 jours</button><button data-r="season" aria-pressed="'+(S.range==='season')+'">Saison, 4 semaines</button></div>'+
   '<ul class="board">'+board+'</ul>'+
   '<div class="card" style="margin-top:16px"><p class="label">Chacun joue à son rythme</p><p class="small" style="margin-top:4px">Pas de questions imposées : chaque membre joue ses propres parties, quand il veut. La ligue compare la moyenne de points par question sur la période. Les parties comptent aussi pour le classement mondial. Version test : ligues simulées, sans serveur.</p></div>'+
   '<div class="card code" style="margin-top:12px"><div><p class="label">Code d’invitation</p><b id="code">'+L.code+'</b></div><button class="mini" id="copyCode">Copier</button></div>'+
   '</section>';
  show(html,true);
  $$('[data-l]').forEach(function(b){b.onclick=function(){S.league=+b.dataset.l;leagues()}});
  $$('[data-r]').forEach(function(b){b.onclick=function(){S.range=b.dataset.r;leagues()}});
  $('#copyCode').onclick=function(){copy(L.code,'Code copié')};
  $('#newL').onclick=newLeague;
}
function newLeague(){
  openSheet('<h2>Créer une ligue</h2><label class="small muted" for="ln">Nom de la ligue</label>'+
   '<input class="field" id="ln" value="Le Club du déjeuner" style="margin:6px 0 16px">'+
   '<p class="small muted">Chaque membre joue ses propres parties. La ligue compare la moyenne de points par question.</p>'+
   '<button class="btn primary" id="mk" style="margin-top:18px">Créer la ligue</button>'+
   '<button class="btn ghost" data-close style="margin-top:10px">Annuler</button>');
  $('#mk').onclick=function(){closeSheet();toast('Maquette : la ligue n’est pas enregistrée')};
}

/* Profil */
var DAYS=[];
function daysData(){
  var m={},ks=[];
  LOG.forEach(function(e){if(e.x)return;var k=dkey(e.t);if(!m[k]){m[k]={k:k,n:0,h:0,t:e.t};ks.push(k)}m[k].n++;m[k].h+=e.i});
  return ks.slice(-10).map(function(k){var o=m[k];return {k:k,n:o.n,pct:Math.round(o.h/o.n*100),lab:new Date(o.t).toLocaleDateString('fr-FR',{day:'numeric',month:'numeric'})}});
}
function chart(){
  var W=320,H=190,l=34,r=14,t=16,b=30,pw=W-l-r,ph=H-t-b,v=DAYS.map(function(d){return d.pct}),n=v.length;
  function X(i){return l+i*pw/(n-1)}
  function Y(p){return t+(1-p/100)*ph}
  var s='<svg id="ch" viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Part de fourchettes justes jour par jour, dernière valeur '+v[n-1]+' %, repère à 80 %" style="display:block;overflow:visible">';
  [0,40,60,80,100].forEach(function(g){s+='<line x1="'+l+'" x2="'+(W-r)+'" y1="'+Y(g)+'" y2="'+Y(g)+'" stroke="var(--line)" stroke-width="1"/><text x="'+(l-8)+'" y="'+(Y(g)+4)+'" text-anchor="end" style="font:11px var(--body);fill:var(--ink2)">'+g+'</text>'});
  s+='<line x1="'+l+'" x2="'+(W-r)+'" y1="'+Y(80)+'" y2="'+Y(80)+'" stroke="var(--ink2)" stroke-width="1.5" stroke-dasharray="5 4"/>';
  s+='<text x="'+(W-r)+'" y="'+(Y(80)-6)+'" text-anchor="end" style="font:600 11px var(--body);fill:var(--ink2)">Repère 80 %</text>';
  var d=v.map(function(p,i){return (i?'L':'M')+X(i).toFixed(1)+' '+Y(p).toFixed(1)}).join(' ');
  s+='<path d="'+d+'" fill="none" stroke="var(--plum)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>';
  s+='<circle cx="'+X(n-1)+'" cy="'+Y(v[n-1])+'" r="5" fill="var(--plum)" stroke="var(--card)" stroke-width="2.5"/>';
  s+='<text x="'+(X(n-1)-8)+'" y="'+(Y(v[n-1])+20)+'" text-anchor="end" style="font:700 12px var(--body);fill:var(--ink)">'+v[n-1]+' %</text>';
  for(var i=0;i<n;i+=1){if(n<=5||i%2===0||i===n-1)s+='<text x="'+X(i)+'" y="'+(H-8)+'" text-anchor="middle" style="font:11px var(--body);fill:var(--ink2)">'+DAYS[i].lab+'</text>'}
  return s+'</svg>';
}
function badge(n,l,c1,c2){
  return '<div class="badge"><svg viewBox="0 0 40 40" aria-hidden="true"><defs><linearGradient id="g'+n+l.length+'" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="'+c1+'"/><stop offset="1" stop-color="'+c2+'"/></linearGradient></defs><circle cx="20" cy="20" r="18" fill="url(#g'+n+l.length+')"/><text x="20" y="26" text-anchor="middle" style="font:700 17px var(--display);fill:#fff">'+n+'</text></svg><span>'+l+'</span></div>';
}
function profile(){
  S.view='profile';S.tab='profile';
  DAYS=daysData();
  var rl=LOG.filter(function(e){return !e.x}).slice(-50),cur=rl.length?Math.round(rl.reduce(function(x,e){return x+e.i},0)/rl.length*100):null;
  var okC=rl.length>=MINQ;
  var conf=!okC?'Pas encore assez de données':(cur<65?'Plutôt sûr de vous':(cur<=90?'Plutôt bien calibré':'Plutôt prudent'));
  var mpos=okC?cur:0,tpos=80;
  var dom=DN.map(function(d){var l=logOf(d).filter(function(e){return !e.x}),p=l.length?Math.round(l.reduce(function(x,e){return x+e.i},0)/l.length*100):null;return '<li class="'+dcn(d)+'"><span>'+d+'</span><div class="b"><i style="width:'+(p||0)+'%"></i><u style="left:80%"></u></div><b>'+(p===null?'—':p+' %')+'</b></li>'}).join('');
  var lvl=DN.map(function(d){var a=avgOf(d),has=ST[d].n>0;return '<li class="'+dcn(d)+'"><span>'+d+'</span><div class="b"><i style="width:'+Math.round(a)+'%"></i></div><b>'+(has?Math.round(a):'—')+'</b></li>'}).join('');
  var rows=DAYS.map(function(d){return '<tr><td>'+d.lab+' ('+d.n+' q.)</td><td>'+d.pct+' %</td></tr>'}).join('');
  var perf=LOG.filter(function(e){return e.k==='tight'}).length,sk=streakN();
  var best=HIST.length?Math.max.apply(null,HIST):0;
  var html='<section class="stack">'+
   '<div class="top" style="margin-bottom:0"><div><p class="date">'+(qCount()?(function(n){return n>1?'Sur vos '+n+' dernières fourchettes':'Sur votre dernière fourchette'})(Math.min(50,LOG.filter(function(e){return !e.x}).length)):'Rien de joué pour l’instant')+'</p><h1>Votre profil</h1></div></div>'+
   '<div class="card"><p class="label">Votre confiance</p><p style="font-weight:700;font-size:18px;margin-top:2px">'+conf+'</p>'+
   (okC?'<p class="small muted" style="margin-top:4px">Vos fourchettes contiennent la bonne réponse '+cur+' fois sur 100. Hors fourchette, la question ne rapporte rien : cherchez votre équilibre.</p>'+
   '<div class="meter" role="img" aria-label="Vous : '+cur+' %, repère : 80 %"><span class="mk" style="left:'+mpos+'%"></span><span class="l" style="left:'+mpos+'%">Vous '+cur+' %</span><span class="tg" style="left:'+tpos+'%"></span></div>'+
   '<div class="scale"><span>Trop sûr de soi</span><span>Trop prudent</span></div>':
   '<p class="small muted" style="margin-top:4px">Jouez au moins '+MINQ+' fourchettes pour voir si vous êtes trop sûr de vous ou trop prudent. Encore '+Math.max(0,MINQ-rl.length)+'.</p>')+'</div>'+
   '<div class="card"><p class="label">Fourchettes justes, jour par jour</p>'+(DAYS.length>=2?'<div class="chartwrap" style="margin-top:10px">'+chart()+'<div class="tip" id="tip" hidden></div></div>'+
   '<details><summary>Voir les valeurs</summary><table><thead><tr><th>Jour</th><th>Fourchettes justes</th></tr></thead><tbody>'+rows+'</tbody></table></details>':'<p class="small muted" style="margin-top:6px">Le graphique apparaît dès que vous avez joué sur deux jours différents.</p>')+'</div>'+
   '<div class="card"><p class="label">Fourchettes justes par thème</p><ul class="dom" style="margin-top:6px">'+dom+'</ul><p class="small muted">Trait pointillé : le repère de 80 %.</p></div>'+
   '<div class="card"><p class="label">Points par question, par thème</p><ul class="dom" style="margin-top:6px">'+lvl+'</ul><p class="small muted">C’est cette moyenne qui fait votre rang au classement.</p></div>'+
   '<div class="card"><p class="label" style="margin-bottom:10px">Vos parties</p><div class="kv"><div><b>'+HIST.length+'</b><span class="small muted">partie'+(HIST.length>1?'s':'')+' terminée'+(HIST.length>1?'s':'')+'</span></div><div><b>'+(HIST.length?best:'—')+'</b><span class="small muted">meilleur score</span></div></div></div>'+
   '<div class="card"><p class="label" style="margin-bottom:12px">Badges · '+Object.keys(BADGES).length+' / '+BD.length+'</p><div class="bgrid">'+BD.map(function(b){var got=!!BADGES[b.id];return '<button data-bd="'+b.id+'" class="'+(got?'':'lock')+'" aria-label="'+esc(b.n)+(got?'':' (à débloquer)')+'">'+medal(b)+'<span>'+esc(b.n)+'</span></button>'}).join('')+'</div></div>'+
   '<div class="card"><p class="label" style="margin-bottom:10px">Survie</p><div class="kv"><div><b>'+SURV.best+'</b><span class="small muted">record de série</span></div><div><b>'+SURV.runs+'</b><span class="small muted">partie'+(SURV.runs>1?'s':'')+' jouée'+(SURV.runs>1?'s':'')+'</span></div></div></div>'+
   '<div class="card"><p class="label" style="margin-bottom:10px">Son</p><div class="seg2" role="group" aria-label="Musique de fond" style="margin:0 0 8px"><button data-snd="m1" aria-pressed="'+(!!SND.m)+'">Musique : oui</button><button data-snd="m0" aria-pressed="'+(!SND.m)+'">Musique : non</button></div><div class="seg2" role="group" aria-label="Son des badges" style="margin:0"><button data-snd="f1" aria-pressed="'+(!!SND.f)+'">Badges : oui</button><button data-snd="f0" aria-pressed="'+(!SND.f)+'">Badges : non</button></div></div>'+
   '<div class="card"><p class="label" style="margin-bottom:10px">Ambiance</p><div class="seg2" role="group" aria-label="Ambiance" style="margin:0"><button data-skin="vif" aria-pressed="'+(S.skin==='vif')+'">Vif</button><button data-skin="warm" aria-pressed="'+(S.skin!=='vif')+'">Chaleureuse</button></div></div>'+
   '<div class="card"><p class="label" style="margin-bottom:10px">Version test</p>'+
   '<p class="small muted">'+nf.format(BANK.length)+' questions dans la banque, '+nf.format(Object.keys(SEEN).length)+' déjà posées, '+FLAGS.length+' signalée'+(FLAGS.length>1?'s':'')+'. Banque écrite de mémoire, à vérifier : signalez toute valeur douteuse.</p>'+
   '<p class="label" style="margin:14px 0 6px">Questions par partie</p><div class="seg2" role="group" aria-label="Questions par partie" style="margin:0">'+[3,5,10,0].map(function(n){return '<button data-gl="'+n+'" aria-pressed="'+(GL===n)+'">'+(n||'Illimité')+'</button>'}).join('')+'</div>'+
   '<button class="btn ghost" id="expFlags" style="margin-top:12px">Copier les signalements</button></div>'+
   '<div class="demo"><span>Classements et ligues simulés : données fictives</span><button class="link" id="reset">Tout remettre à zéro</button></div></section>';
  show(html,true);
  $$('button[data-skin]').forEach(function(b){b.onclick=function(){S.skin=b.dataset.skin;applySkin();save();profile()}});
  $$('[data-snd]').forEach(function(b){b.onclick=function(){var k=b.dataset.snd;if(k[0]==='m')SND.m=+k[1];else SND.f=+k[1];save();if(k==='f1')jingle();profile()}});
  $$('[data-bd]').forEach(function(b){b.onclick=function(){
    var bb=BD.filter(function(x){return x.id===b.dataset.bd})[0],got=BADGES[bb.id],cur=Math.min(bb.max,bb.cur());
    openSheet('<div style="text-align:center"><div style="width:110px;margin:0 auto 8px">'+medal(bb)+'</div><h2>'+esc(bb.n)+'</h2><p class="small muted" style="margin-top:4px">'+esc(bb.d)+'</p>'+
      (got?'<p style="margin-top:12px;font-weight:600">Obtenu le '+new Date(got).toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'})+'</p>':
      (bb.max>1?'<div class="bprog"><i style="width:'+Math.round(cur/bb.max*100)+'%"></i></div><p class="small muted">'+nf.format(Math.floor(cur))+' / '+nf.format(bb.max)+'</p>':'<p style="margin-top:12px;font-weight:600">Pas encore débloqué</p>'))+
      '</div><button class="btn primary" data-close style="margin-top:16px">Fermer</button>');
  }});
  $$('[data-gl]').forEach(function(b){b.onclick=function(){GL=+b.dataset.gl;save();profile()}});
  $('#expFlags').onclick=function(){if(!FLAGS.length){toast('Aucun signalement');return}copy(JSON.stringify(FLAGS,null,1),FLAGS.length+' signalement'+(FLAGS.length>1?'s':'')+' copié'+(FLAGS.length>1?'s':''))};
  $('#reset').onclick=function(){resetStats();FLAGS=[];save();G={set:[],ans:[],qi:0,theme:null,before:0};S.wt='all';toast('Progression remise à zéro');home()};
  var svg=$('#ch'),tip=$('#tip');
  if(svg){
    svg.addEventListener('pointermove',function(e){
      var r=svg.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*320,n=DAYS.length;
      var i=Math.max(0,Math.min(n-1,Math.round((x-34)/((320-34-14)/(n-1)))));
      var px=(34+i*(320-34-14)/(n-1))/320*r.width,py=(16+(1-DAYS[i].pct/100)*(190-16-30))/190*r.height;
      tip.hidden=false;tip.style.left=px+'px';tip.style.top=py+'px';tip.textContent=DAYS[i].lab+' : '+DAYS[i].pct+' % ('+DAYS[i].n+' question'+(DAYS[i].n>1?'s':'')+')';
    });
    svg.addEventListener('pointerleave',function(){tip.hidden=true});
  }
}

/* Navigation */
$$('.tab').forEach(function(b){b.onclick=function(){
  var t=b.dataset.tab;
  if(t==='home')home();else if(t==='world')world();else if(t==='leagues')leagues();else profile();
}});
$('#sheetbg').addEventListener('click',function(e){if(e.target.id==='sheetbg'||e.target.hasAttribute('data-close'))closeSheet()});
$('#sheet').addEventListener('click',function(e){if(e.target.hasAttribute('data-close'))closeSheet()});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeSheet()});
applySkin();
function backNav(){var ov=$('#badgeov');if(ov&&!ov.hidden){ov.hidden=true;setTimeout(flushBadges,150);return true}if(!$('#sheetbg').hidden){closeSheet();return true}if(S.view!=='home'){home();return true}return false}
var CAP=window.Capacitor;
if(CAP&&CAP.Plugins&&CAP.Plugins.App){if(CAP.Plugins.App.addListener){CAP.Plugins.App.addListener('appStateChange',function(st){if(st&&st.isActive)auResume();else auSuspend()})}
CAP.Plugins.App.addListener('backButton',function(){if(!backNav())CAP.Plugins.App.exitApp()})}
home();
})();
</script>
